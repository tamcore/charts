podSecurityContext:
  fsGroup: 65534
  runAsGroup: 65534
  runAsUser: 65534
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  privileged: false
  capabilities:
    add: null
    drop:
    - all
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

env:
  "EUFY_COUNTRY": "DE"

secretEnv:
  "EUFY_EMAIL": "foo@bar.com"
  "EUFY_PASSWORD": "bar"
