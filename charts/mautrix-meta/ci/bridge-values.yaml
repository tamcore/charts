config:
  database:
    type: sqlite3-fk-wal
    uri: "file:/tmp/bridge-ci.db?_txlock=immediate"
  homeserver:
    address: "http://localhost:8008"
    domain: "localhost"
  appservice:
    id: mautrix-meta-ci
    bot:
      username: metabot
    address: "http://localhost:29319"
    port: 29319

registration:
  id: mautrix-meta-ci
  url: "http://localhost:29319"
  as_token: "ci-meta-as-placeholder"
  hs_token: "ci-meta-hs-placeholder"
  sender_localpart: metabot
  namespaces:
    users:
      - exclusive: true
        regex: "@meta_.*:localhost"
    aliases: []
    rooms: []
  rate_limited: false

readinessProbe: null

livenessProbe:
  httpGet:
    path: /_matrix/mau/live
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 3
