image:
  repository: ghcr.io/vacuula/vacuula
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# The image runs as root and binds 443 (Gen3) and VACUULA_PORT (80 by default).
podSecurityContext: {}

securityContext: {}

vacuula:
  # Web UI + API, plain HTTP. Rendered as VACUULA_PORT.
  port: 80
  # Gen4 robots, raw TLS. Rendered as GEN4_PORT.
  gen4Port: 3443
  # Gen3 robots, TLS on the fixed port 443.
  gen3Enabled: true
  gen4Enabled: true
  # mDNS does not reach the LAN from the pod network.
  mdnsEnabled: false

# Additional environment variables, e.g. VACUULA_TZ.
env: {}
  # "VACUULA_TZ": "Europe/Berlin"

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
# Web UI + API (http port). Ingress and HTTPRoute target this Service.
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  annotations: {}
  port: 80

# Robot endpoints (gen3/gen4), rendered as <fullname>-robots. Robots verify the app's own
# self-signed CA, so expose these ports at L4 without TLS termination or passthrough proxies.
# Skipped when disabled or when neither gen3 nor gen4 is enabled.
robotService:
  enabled: true
  type: LoadBalancer
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: ""
  ports:
    gen3: 443
    gen4: 3443

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# Targets the http port only.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Gateway API HTTPRoute. Targets the http port only.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway
  #    sectionName: https
  hostnames: []
  #  - vacuula.example.com
  matches:
    - path:
        type: PathPrefix
        value: /
  filters: []
  #  - type: ExtensionRef
  #    extensionRef:
  #      group: gateway.nginx.org
  #      kind: SnippetsFilter
  #      name: lan-only

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  tcpSocket:
    port: http
readinessProbe:
  tcpSocket:
    port: http

# Holds the SQLite database, the generated CA + certificates and uploaded maps.
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  # Use an existing PVC instead of the volumeClaimTemplate.
  existingClaim: ""
  labels: {}
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is set
  # storageClass: "-"
  size: 1Gi

# Additional volumes on the output StatefulSet definition.
volumes: []

# Additional volumeMounts on the output StatefulSet definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
