apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix-ci
data:
  homeserver.yaml: |
    server_name: "ci.local"
    pid_file: /data/homeserver.pid
    listeners:
      - port: 8008
        type: http
        x_forwarded: false
        resources:
          - names: [client, federation]
    database:
      name: sqlite3
      args:
        database: /data/homeserver.db
    log_config: /config/log.config
    media_store_path: /data/media_store
    signing_key_path: /data/homeserver.signing.key
    report_stats: false
    suppress_key_server_warning: true
    trusted_key_servers:
      - server_name: "matrix.org"
    app_service_config_files:
      - /registrations/telegram.yaml
      - /registrations/whatsapp.yaml
      - /registrations/meta.yaml
      - /registrations/facebook.yaml
      - /registrations/instagram.yaml

  log.config: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    filters:
      context:
        (): synapse.logging.context.LoggingContextFilter
        request: ""
    handlers:
      console:
        class: logging.StreamHandler
        formatter: precise
        filters: [context]
    loggers:
      synapse.storage.SQL:
        level: WARNING
    root:
      level: WARNING
      handlers: [console]
    disable_existing_loggers: false
