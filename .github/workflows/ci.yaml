name: ci-tests

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6

    - name: pre-commit
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  get-k8s-versions:
    runs-on: ubuntu-24.04

    outputs:
      versions: ${{ steps.get-k8s-versions.outputs.versions }}

    steps:
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Determine latest kind versions
        id: get-k8s-versions
        shell: bash
        run: |
          set -x
          KIND_VERSIONS=$(crane ls kindest/node | sort -n | grep ^v)
          versions=$(for kind_minor in $(echo "$KIND_VERSIONS" | cut -d '.' -f2 | sort | uniq | tail -3)
          do
            echo "$KIND_VERSIONS" | grep "v1.${kind_minor}" | tail -1
          done | tr '\n' ',' | sed 's/,$//')
          json_output=$( jq -c -n --arg versions "$versions" '$versions | split(",")' )
          echo "versions=${json_output}" >> $GITHUB_OUTPUT

      - name: Print versions
        shell: bash
        run: |
          echo "Detected KiND versions: ${{ steps.get-k8s-versions.outputs.versions }}"

  lint-test-chart:
    runs-on: ubuntu-24.04
    needs: [get-k8s-versions]

    strategy:
      fail-fast: false

      matrix:
        k8s_version: ${{ fromJson(needs.get-k8s-versions.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (lint)
        run: |
          ct \
            lint \
            --config .ct.yaml \
            ${{github.event_name == 'workflow_dispatch' && '--all'}} ;

      - if: steps.list-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: "kindest/node:${{ matrix.k8s_version }}"
          config: .kind-config.yaml

      - name: Run chart-testing (install)
        run: |
          ct \
            install \
            --config .ct.yaml \
            --debug \
            ${{github.event_name == 'workflow_dispatch' && '--all'}} ;

  integration-test:
    runs-on: ubuntu-24.04
    needs: [get-k8s-versions]

    strategy:
      fail-fast: false

      matrix:
        k8s_version: ${{ fromJson(needs.get-k8s-versions.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bridge-related changes
        id: detect-changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed=$(git diff --name-only "$base" "$head" | grep -E '^(charts/mautrix-[^/]+|test/integration)/' || true)
            if [[ -n "$changed" ]]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: "kindest/node:${{ matrix.k8s_version }}"
          config: .kind-config.yaml

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Apply test infrastructure
        run: kubectl apply -k test/integration

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Wait for postgres
        run: kubectl -n matrix-ci rollout status deployment/postgres --timeout=120s

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Wait for synapse
        run: kubectl -n matrix-ci rollout status deployment/synapse --timeout=300s

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Install all bridges
        run: |
          for bridge in telegram whatsapp meta facebook instagram; do
            helm upgrade --install mautrix-$bridge charts/mautrix-$bridge \
              --namespace matrix-ci --create-namespace \
              -f test/integration/bridges/_shared.values.yaml \
              -f test/integration/bridges/$bridge.values.yaml \
              --wait=false
          done

      - if: steps.detect-changes.outputs.changed == 'true'
        name: Wait for all bridges Ready
        run: |
          for bridge in telegram whatsapp meta facebook instagram; do
            kubectl -n matrix-ci wait --for=condition=Ready pod \
              -l app.kubernetes.io/instance=mautrix-$bridge \
              --timeout=180s
          done

      - if: always()
        name: Collect diagnostics
        run: |
          kubectl -n matrix-ci get pods -o wide || true
          kubectl -n matrix-ci get events --sort-by=.lastTimestamp | tail -40 || true
          for bridge in telegram whatsapp meta facebook instagram; do
            echo "=== mautrix-$bridge logs ==="
            kubectl -n matrix-ci logs -l app.kubernetes.io/instance=mautrix-$bridge --all-containers --ignore-errors=true --tail=50 || true
          done
          echo "=== synapse logs ==="
          kubectl -n matrix-ci logs deployment/synapse --tail=50 || true
